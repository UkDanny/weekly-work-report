<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>주간 업무 일지</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f1923;--bg2:#162030;--bg3:#1c2a3a;--bg4:#243245;--bdr:#2d3f52;--acc:#4f46e5;--acc2:#6366f1;--txt:#c8d6e5;--muted:#5f7a96;--green:#10b981;--red:#f87171;--ylw:#fbbf24;--blue:#60a5fa}
body{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:var(--bg);color:var(--txt);font-size:13px;height:100vh;overflow:hidden}
#rt{display:flex;flex-direction:column;height:100vh}
#hdr{height:46px;background:var(--bg3);border-bottom:1px solid var(--bdr);display:flex;align-items:center;padding:0 14px;gap:14px;flex-shrink:0;z-index:10}
#bd{display:flex;flex:1;overflow:hidden}
#sb{width:182px;background:var(--bg2);border-right:1px solid var(--bdr);overflow-y:auto;flex-shrink:0}
#mn{flex:1;overflow-y:auto;padding:20px 22px;background:var(--bg)}
#rp{width:208px;background:var(--bg2);border-left:1px solid var(--bdr);flex-shrink:0;padding:10px;overflow-y:auto}
.hlogo{display:flex;flex-direction:column;line-height:1.2}
.hlogo b{font-size:13px;font-weight:700;color:#e2ecf8}
.hlogo small{font-size:9px;color:var(--muted);letter-spacing:1.5px}
.hlang{display:flex;align-items:center;gap:3px;font-size:11px;color:var(--muted);background:var(--bg4);padding:3px 8px;border-radius:5px;border:1px solid var(--bdr)}
.hlang b{font-weight:600;color:var(--txt)}
.hlang s{text-decoration:none;opacity:.4}
.hwk{display:flex;align-items:center;gap:5px}
.hwk button{background:none;border:1px solid var(--bdr);color:var(--txt);padding:2px 8px;border-radius:5px;cursor:pointer;font-size:12px;transition:.12s}
.hwk button:hover{background:var(--bg4)}
.wl{font-size:12px;font-weight:500;background:var(--bg4);padding:3px 10px;border-radius:5px;border:1px solid var(--bdr);color:#e2ecf8;min-width:160px;text-align:center}
.hright{margin-left:auto;display:flex;align-items:center;gap:8px}
.hbtn{background:none;border:1px solid var(--bdr);color:var(--txt);padding:4px 10px;border-radius:5px;cursor:pointer;font-size:12px;font-family:inherit;transition:.12s}
.hbtn:hover{background:var(--bg4)}
.hname{cursor:pointer;padding:4px 8px;border-radius:6px;text-align:right;transition:.12s}
.hname:hover{background:var(--bg4)}
.hname .nm{font-size:12px;font-weight:600;color:#e2ecf8}
.hname .dp{font-size:10px;color:var(--muted)}
.sb-sec{font-size:10px;color:var(--muted);padding:13px 13px 5px;letter-spacing:.7px;text-transform:uppercase;display:flex;align-items:center;justify-content:space-between}
.sb-sec span{cursor:pointer;opacity:.6;transition:.1s}.sb-sec span:hover{opacity:1}
.sbi{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;cursor:pointer;border-radius:7px;margin:1px 5px;transition:.12s;gap:8px}
.sbi:hover{background:var(--bg4)}
.sbi.act{background:var(--acc)}
.sbi .sbd{font-size:13px;font-weight:500;color:var(--txt)}
.sbi .sbdt{font-size:11px;color:var(--muted)}
.sbi.act .sbdt{color:rgba(255,255,255,.6)}
.sbi.act .sbd{color:#fff}
.sbdot{width:7px;height:7px;border-radius:50%;border:1px solid var(--bdr);flex-shrink:0}
.sbdot.done{background:var(--green);border-color:var(--green)}
.sbwk{display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;border-radius:7px;margin:1px 5px;transition:.12s;font-size:13px;font-weight:500;color:var(--txt)}
.sbwk:hover{background:var(--bg4)}
.sbwk.act{background:var(--acc);color:#fff}
.sbrec{padding:5px 13px;cursor:pointer;font-size:11px;color:var(--muted);transition:.15s}
.sbrec:hover{color:var(--txt)}
.mhd{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px}
.mtit h2{font-size:17px;font-weight:700;color:#e2ecf8}
.mdt{font-size:11px;color:var(--muted);margin-top:3px}
.lvbar{display:flex;gap:3px}
.lv{padding:4px 12px;border-radius:5px;font-size:12px;border:1px solid var(--bdr);background:transparent;color:var(--muted);cursor:pointer;transition:.12s;font-family:inherit}
.lv.on{background:var(--bg4);color:var(--txt);border-color:var(--acc2)}
.card{background:var(--bg3);border:1px solid var(--bdr);border-radius:10px;padding:16px 18px;margin-bottom:14px}
.cardh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px}
.cardt h3{font-size:14px;font-weight:600;color:#e2ecf8}
.cardt small{font-size:11px;color:var(--muted);margin-top:2px;display:block}
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;border:none;font-family:inherit;transition:.12s;white-space:nowrap}
.btnp{background:var(--acc);color:#fff}.btnp:hover{background:var(--acc2)}
.btns{background:var(--bg4);color:var(--txt);border:1px solid var(--bdr)}.btns:hover{background:#2a3c50}
.btng{background:rgba(16,185,129,.15);color:#6ee7b7;border:1px solid rgba(16,185,129,.3)}.btng:hover{background:rgba(16,185,129,.25)}
.btn:disabled{opacity:.45;cursor:not-allowed}
textarea,input[type=text],input[type=password]{width:100%;padding:9px 12px;border:1px solid var(--bdr);border-radius:7px;font-family:inherit;font-size:13px;background:var(--bg2);color:var(--txt);resize:vertical;outline:none;transition:.12s;line-height:1.6}
textarea:focus,input:focus{border-color:var(--acc2)}
::placeholder{color:var(--muted)}
label{font-size:11px;font-weight:500;color:var(--muted);display:block;margin-bottom:5px}
.fg{margin-bottom:12px}
.drop{border:2px dashed var(--bdr);border-radius:8px;padding:14px;text-align:center;cursor:pointer;position:relative;transition:.12s;display:flex;flex-direction:column;align-items:center;gap:3px}
.drop:hover,.drop.ov{border-color:var(--acc);background:rgba(79,70,229,.06)}
.drop input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.drop p{font-size:12px;color:var(--muted);pointer-events:none}
.drop small{font-size:10px;color:var(--muted);opacity:.7;pointer-events:none}
.ftags{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.ftag{background:var(--bg4);border:1px solid var(--bdr);padding:2px 8px 2px 7px;border-radius:4px;font-size:11px;display:inline-flex;align-items:center;gap:4px}
.ftag button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:11px;padding:0;line-height:1}
.ftag button:hover{color:var(--red)}
.prevbox{margin-top:13px;padding-top:13px;border-top:1px solid var(--bdr)}
.psec{margin-bottom:10px}
.psec h4{font-size:10px;font-weight:700;color:var(--acc2);letter-spacing:.6px;text-transform:uppercase;margin-bottom:5px}
.ptxt{background:var(--bg2);border:1px solid var(--bdr);border-radius:7px;padding:11px 13px;font-size:13px;line-height:1.75;white-space:pre-wrap;word-break:break-word;color:var(--txt)}
/* RIGHT PANEL */
.ctabs{display:flex;gap:3px;margin-bottom:8px}
.ctab{padding:3px 10px;border-radius:4px;font-size:11px;border:1px solid var(--bdr);background:transparent;cursor:pointer;font-family:inherit;color:var(--muted);transition:.1s}
.ctab.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.calnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.calnav h4{font-size:12px;font-weight:600;color:#e2ecf8}
.calnav button{background:none;border:none;color:var(--muted);cursor:pointer;padding:2px 5px;border-radius:3px;font-size:12px;transition:.1s}
.calnav button:hover{background:var(--bg4);color:var(--txt)}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
.cdh{text-align:center;font-size:9px;color:var(--muted);padding:2px 0;font-weight:600}
.cdh:first-child{color:var(--red)}.cdh:last-child{color:var(--blue)}
.cc{text-align:center;padding:3px 2px;border-radius:4px;font-size:11px;position:relative;cursor:default;line-height:1.5}
.cc:hover:not(.om){background:var(--bg4)}
.cc.tod{background:var(--acc);color:#fff;font-weight:700}
.cc.twk:not(.tod){background:rgba(79,70,229,.16)}
.cc.om{opacity:.3}
.cc.hol:not(.tod){color:var(--red)}
.cc.sat:not(.tod){color:var(--blue)}
.cc .hd{position:absolute;bottom:1px;left:50%;transform:translateX(-50%);width:3px;height:3px;border-radius:50%;background:var(--ylw)}
.wssec{margin-top:12px;padding-top:10px;border-top:1px solid var(--bdr)}
.wstit{font-size:10px;font-weight:700;color:var(--ylw);margin-bottom:7px;display:flex;align-items:center;gap:4px}
.wsrow{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid rgba(45,63,82,.6);font-size:11px}
.wsrow:last-child{border:none}
.wsd{color:var(--muted);font-weight:500}
.wss{color:var(--green);font-weight:500}
.wss.no{color:var(--muted)}
/* WEEKLY */
.wdrow{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--bdr)}
.wdrow:last-child{border:none}
.wdbadge{width:26px;height:26px;border-radius:6px;background:var(--bg4);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--muted);flex-shrink:0}
.wdbadge.done{background:rgba(16,185,129,.15);color:var(--green)}
.wdinfo{flex:1;overflow:hidden}
.wdnm{font-size:12px;font-weight:500;color:#e2ecf8}
.wdtxt{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
/* MODALS */
.mover{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:100}
.modal{background:var(--bg3);border:1px solid var(--bdr);border-radius:12px;padding:22px;max-width:460px;width:92%;max-height:82vh;overflow-y:auto}
.modal h3{font-size:15px;font-weight:700;color:#e2ecf8;margin-bottom:16px}
.mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.exopts{display:flex;gap:8px;margin:12px 0}
.exopt{flex:1;padding:16px 8px;border-radius:9px;border:1px solid var(--bdr);background:var(--bg2);color:var(--txt);cursor:pointer;text-align:center;font-family:inherit;transition:.12s}
.exopt:hover{border-color:var(--acc);background:rgba(79,70,229,.1)}
.exopt .ei{font-size:26px;display:block;margin-bottom:6px}
.exopt .el{font-size:12px;font-weight:600}
.sep{height:1px;background:var(--bdr);margin:13px 0}
.ainfo{background:rgba(16,185,129,.07);border:1px solid rgba(16,185,129,.2);border-radius:7px;padding:10px 12px;font-size:11px;color:#6ee7b7;line-height:1.75;margin-top:10px;white-space:pre-line}
@keyframes sp{to{transform:rotate(360deg)}}
.sp{display:inline-block;width:12px;height:12px;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
.spd{border-color:rgba(99,102,241,.25);border-top-color:var(--acc2)}
#toast{position:fixed;bottom:18px;right:18px;background:var(--bg3);border:1px solid var(--bdr);color:var(--txt);padding:9px 15px;border-radius:8px;font-size:12px;z-index:999;transform:translateY(60px);opacity:0;transition:all .25s;box-shadow:0 6px 20px rgba(0,0,0,.4);pointer-events:none}
#toast.on{transform:translateY(0);opacity:1}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:#2d3f52;border-radius:2px}
</style>
</head>
<body>
<div id="rt">
  <div id="hdr">
    <div class="hlogo"><b>📋 주간 업무 일지</b><small>WEEKLY WORK REPORT</small></div>
    <div class="hlang">🌐 <b>KO</b><s> · </s><b>EN</b><s> · </s><b>JA</b><s> · </s><b>VI</b></div>
    <div class="hwk">
      <button id="pw">◀</button>
      <div class="wl" id="wlbl"></div>
      <button id="nw">▶</button>
    </div>
    <div class="hright">
      <button class="hbtn" id="expbtn">📤 내보내기</button>
      <button class="hbtn" id="setbtn">⚙️ 설정</button>
      <div class="hname" id="hnamebtn">
        <div class="nm" id="hname">이름 미설정</div>
        <div class="dp" id="hdept">소속 미설정 · 클릭해서 수정</div>
      </div>
    </div>
  </div>
  <div id="bd">
    <div id="sb">
      <div class="sb-sec">일일 업무</div>
      <div id="sbdays"></div>
      <div class="sb-sec">주간 보고</div>
      <div class="sbwk" id="sbwk">📊 주간 업무 보고</div>
      <div class="sb-sec">지난 기록 <span id="sbtog">▼</span></div>
      <div id="sbrecs"></div>
    </div>
    <div id="mn"></div>
    <div id="rp">
      <div class="ctabs">
        <button class="ctab on" data-ct="kr">한국</button>
        <button class="ctab" data-ct="vn">베트남</button>
      </div>
      <div class="calnav">
        <button id="calp">◀</button>
        <h4 id="caltit"></h4>
        <button id="caln">▶</button>
      </div>
      <div class="cgrid" id="calgrid"></div>
      <div class="wssec">
        <div class="wstit">📌 이번 주 요약</div>
        <div id="wsstat"></div>
      </div>
    </div>
  </div>
</div>

<!-- Settings -->
<div class="mover" id="setmod" style="display:none">
  <div class="modal">
    <h3>⚙️ 설정</h3>
    <div class="fg"><label>이름</label><input type="text" id="si-name" placeholder="홍길동"></div>
    <div class="fg"><label>소속 / 부서</label><input type="text" id="si-dept" placeholder="영업1팀"></div>
    <div class="sep"></div>
    <div class="fg">
      <label>Anthropic API 키 <span style="color:var(--muted);font-weight:400">(AI 기능 사용 시 필요)</span></label>
      <input type="password" id="si-api" placeholder="sk-ant-...">
    </div>
    <div class="ainfo">✅ API 필요: AI 일지 작성, 진척 비교 분석
🆓 무료 사용: 자동 요약, 캘린더, 저장·내보내기
📖 발급: console.anthropic.com → API Keys → Create Key
📝 AI는 한국어·영어·일본어·베트남어 입력 모두 이해합니다</div>
    <div class="mfoot">
      <button class="btn btns" id="setclose">취소</button>
      <button class="btn btnp" id="setsave">💾 저장</button>
    </div>
  </div>
</div>

<!-- Export -->
<div class="mover" id="expmod" style="display:none">
  <div class="modal">
    <h3>📤 내보내기</h3>
    <p style="font-size:12px;color:var(--muted)">이번 주 업무일지를 내보냅니다</p>
    <div class="exopts">
      <button class="exopt" id="expdf"><span class="ei">📄</span><span class="el">PDF</span></button>
      <button class="exopt" id="exxl"><span class="ei">📊</span><span class="el">Excel</span></button>
      <button class="exopt" id="exwd"><span class="ei">📝</span><span class="el">Word</span></button>
    </div>
    <div class="mfoot"><button class="btn btns" id="expclose">닫기</button></div>
  </div>
</div>

<div id="toast"></div>
<script>
// ── HOLIDAYS ─────────────────────────────────────
const HKR={'2025-01-01':'신정','2025-01-29':'설날','2025-03-01':'삼일절','2025-05-05':'어린이날',
'2025-05-06':'부처님오신날','2025-06-06':'현충일','2025-08-15':'광복절','2025-10-03':'개천절',
'2025-10-06':'추석','2025-10-09':'한글날','2025-12-25':'크리스마스',
'2026-01-01':'신정','2026-01-29':'설날','2026-03-01':'삼일절','2026-05-05':'어린이날',
'2026-05-24':'부처님오신날','2026-06-06':'현충일','2026-08-15':'광복절','2026-10-03':'개천절',
'2026-09-25':'추석','2026-10-09':'한글날','2026-12-25':'크리스마스'};
const HVN={'2025-01-01':'원단','2025-01-29':'Tết','2025-01-30':'Mùng 2','2025-01-31':'Mùng 3',
'2025-02-01':'Mùng 4','2025-04-07':'Hùng Vương','2025-04-30':'Giải Phóng','2025-05-01':'Lao động','2025-09-02':'Quốc Khánh',
'2026-01-01':'원단','2026-01-29':'Tết','2026-01-30':'Mùng 2','2026-01-31':'Mùng 3',
'2026-04-07':'Hùng Vương','2026-04-30':'Giải Phóng','2026-05-01':'Lao động','2026-09-02':'Quốc Khánh'};

// ── CONSTANTS ─────────────────────────────────────
const DAYS=['mon','tue','wed','thu','fri'];
const DN={mon:'월요일',tue:'화요일',wed:'수요일',thu:'목요일',fri:'금요일'};
const DS={mon:'월',tue:'화',wed:'수',thu:'목',fri:'금'};
const WD=['일','월','화','수','목','금','토'];
const MN=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];

// ── STATE ────────────────────────────────────────
const S={
  ws:'',view:'daily',day:'mon',
  name:'',dept:'',apiKey:'',lv:'medium',
  calTab:'kr',calY:new Date().getFullYear(),calM:new Date().getMonth(),
  prevOpen:{},genning:{},recOpen:false
};

// ── DATE UTILS ───────────────────────────────────
function wkStart(d){
  const x=new Date(d),day=x.getDay();
  x.setDate(x.getDate()-day+(day===0?-6:1));
  x.setHours(0,0,0,0);return x.toISOString().split('T')[0];
}
function tod(){return new Date().toISOString().split('T')[0];}
function dayDate(ws,i){const d=new Date(ws);d.setDate(d.getDate()+i);return d;}
function fmtDate(ws,i){const d=dayDate(ws,i);return`${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일`;}
function fmtShort(d){return`${d.getMonth()+1}.${String(d.getDate()).padStart(2,'0')}`;}
function wkLabel(ws){
  const s=new Date(ws),e=new Date(ws);e.setDate(e.getDate()+4);
  return`${fmtShort(s)} ~ ${fmtShort(e)}${ws===wkStart(new Date())?' (이번 주)':''}`;
}
function todayDay(){const d=new Date().getDay();return(d>=1&&d<=5)?DAYS[d-1]:'mon';}

// ── PERSISTENCE ──────────────────────────────────
function mkDD(){return{memo:'',files:[],fc:[],gen:null};}
function mkWD(){return{prevSum:{text:'',gen:null},days:{mon:mkDD(),tue:mkDD(),wed:mkDD(),thu:mkDD(),fri:mkDD()},weekly:{memo:'',gen:null,compare:null}};}
const cache={};
function gwd(ws){
  if(!cache[ws]){
    try{const d=localStorage.getItem('wlv3_'+ws);cache[ws]=d?JSON.parse(d):mkWD();}
    catch(e){cache[ws]=mkWD();}
    // Ensure all days exist
    DAYS.forEach(d=>{if(!cache[ws].days[d])cache[ws].days[d]=mkDD();});
  }
  return cache[ws];
}
function swd(ws){
  try{
    const d=JSON.parse(JSON.stringify(cache[ws]));
    DAYS.forEach(dy=>{if(d.days[dy])d.days[dy].fc=[];});
    localStorage.setItem('wlv3_'+ws,JSON.stringify(d));
  }catch(e){}
}
function loadCfg(){try{const d=JSON.parse(localStorage.getItem('wlv3_cfg')||'{}');S.name=d.name||'';S.dept=d.dept||'';S.apiKey=d.apiKey||'';}catch(e){}}
function saveCfg(){try{localStorage.setItem('wlv3_cfg',JSON.stringify({name:S.name,dept:S.dept,apiKey:S.apiKey}));}catch(e){}}
function allWks(){
  const ks=[];
  try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('wlv3_2'))ks.push(k.replace('wlv3_',''));}}catch(e){}
  return ks.sort().reverse();
}

// ── TOAST ─────────────────────────────────────────
let _tt;
function toast(m){const el=document.getElementById('toast');el.textContent=m;el.classList.add('on');clearTimeout(_tt);_tt=setTimeout(()=>el.classList.remove('on'),2600);}

// ── AI ───────────────────────────────────────────
async function callAI(msgs,sys){
  if(!S.apiKey){toast('⚠️ API 키 필요 — 설정에서 입력해주세요');return null;}
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':S.apiKey,
        'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:900,system:sys,messages:msgs})
    });
    const d=await r.json();
    if(d.error){toast('API 오류: '+d.error.message);return null;}
    return d.content?.[0]?.text||null;
  }catch(e){toast('연결 오류 발생');return null;}
}

내용

function parseSec(txt){
  const g=(t,n)=>{const m=txt.match(new RegExp(`\\[${t}\\]([\\s\\S]*?)(?=\\[${n}\\]|$)`));return m?m[1].trim():'';};
  const c=g('업무내용','추진결과'),r=g('추진결과','업무인사이트'),i=g('업무인사이트','$');
  return(c||r||i)?{content:c,results:r,insights:i}:{content:txt.trim(),results:'',insights:''};
}

// ── FREE SUMMARY ──────────────────────────────────
function freeSummary(memo,lv,fc){
  const lines=memo.split('\n').map(l=>l.trim()).filter(Boolean);
  if(!lines.length)return null;
  const n=lines.length,dens=n>6?'고밀도':n>3?'보통':'저밀도';
  if(lv==='simple')return{content:'• '+lines.join('\n• '),results:`총 ${n}건 업무 수행`,insights:'업무 기록을 지속하면 생산성이 향상됩니다.'};
  if(lv==='detailed')return{
    content:`【금일 업무 상세】\n${lines.map((l,i)=>`${i+1}. ${l}`).join('\n')}\n\n총 ${n}건 업무${fc?` (첨부 ${fc}건 포함)`:''}.`,
    results:`【추진 결과】\n총 ${n}건 업무 수행.\n${lines.map(l=>`• ${l}: 처리 완료`).join('\n')}`,
    insights:`【인사이트】\n• 업무량: ${n}건 (${dens})\n• 핵심: ${lines[0]}\n• 권고: 반복 업무 자동화 및 우선순위 재정비 검토`
  };
  return{
    content:`【금일 업무】\n${lines.map((l,i)=>`${i+1}. ${l}`).join('\n')}`,
    results:`총 ${n}건 업무 수행. 주요 업무에 집중하였습니다.${fc?` 첨부파일 ${fc}건 포함.`:''}`,
    insights:`• 업무 ${n}건 처리 (${dens})\n• 내일 우선순위 업무 계획 수립 권장\n• 미완료 업무 이월 여부 확인 필요`
  };
}

// ── RENDER CALENDAR ───────────────────────────────
function renderCal(){
  const{calY:y,calM:m,calTab:ct,ws}=S;
  const HOL=ct==='kr'?HKR:HVN;
  document.getElementById('caltit').textContent=`${y}년 ${MN[m]}`;
  const fd=new Date(y,m,1).getDay(),dim=new Date(y,m+1,0).getDate(),pd=new Date(y,m,0).getDate();
  const today=tod();
  const twk=new Set(DAYS.map((_,i)=>dayDate(ws,i).toISOString().split('T')[0]));
  let html=WD.map(d=>`<div class="cdh">${d}</div>`).join('');
  const tc=Math.ceil((fd+dim)/7)*7;
  for(let i=0;i<tc;i++){
    let day,yr,mo,oth=false;
    if(i<fd){day=pd-fd+i+1;mo=m===0?11:m-1;yr=m===0?y-1:y;oth=true;}
    else if(i>=fd+dim){day=i-fd-dim+1;mo=m===11?0:m+1;yr=m===11?y+1:y;oth=true;}
    else{day=i-fd+1;mo=m;yr=y;}
    const ds=`${yr}-${String(mo+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const isH=!oth&&HOL[ds],isT=ds===today,isTW=twk.has(ds),isSat=i%7===6;
    const cls=['cc',oth?'om':'',isT?'tod':isTW?'twk':'',isH&&!oth?'hol':'',isSat&&!oth?'sat':''].filter(Boolean).join(' ');
    html+=`<div class="${cls}">${day}${isH&&!oth?'<div class="hd"></div>':''}</div>`;
  }
  document.getElementById('calgrid').innerHTML=html;
  const data=gwd(ws);
  document.getElementById('wsstat').innerHTML=DAYS.map(d=>{
    const done=!!(data.days[d]?.memo||data.days[d]?.gen);
    return`<div class="wsrow"><span class="wsd">${DS[d]}</span><span class="wss${done?'':' no'}">${done?'완료':'미작성'}</span></div>`;
  }).join('');
}

// ── FILE HANDLING ────────────────────────────────
async function handleFiles(fl,dd,ws){
  for(const f of Array.from(fl)){
    dd.files.push(f.name);
    const ext=f.name.split('.').pop().toLowerCase();
    if(['png','jpg','jpeg','gif','webp'].includes(ext)){
      const b64=await new Promise((r,j)=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.onerror=j;fr.readAsDataURL(f);});
      dd.fc.push({type:'img',name:f.name,mt:f.type||'image/png',data:b64.split(',')[1]});
    }else if(['xlsx','xls'].includes(ext)&&window.XLSX){
      try{const ab=await f.arrayBuffer();const wb=XLSX.read(ab,{type:'array'});let t='';wb.SheetNames.forEach(n=>{t+=`[${n}]\n${XLSX.utils.sheet_to_csv(wb.Sheets[n])}\n\n`;});dd.fc.push({type:'txt',name:f.name,content:t.slice(0,2500)});}catch(e){}
    }else if(['txt','csv','md'].includes(ext)){
      const t=await new Promise((r,j)=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.onerror=j;fr.readAsText(f);});
      dd.fc.push({type:'txt',name:f.name,content:t.slice(0,2500)});
    }
  }
  swd(ws);renderFtags(dd);
}
function renderFtags(dd){
  const el=document.getElementById('ftags');if(!el)return;
  el.innerHTML=(dd.files||[]).map((f,i)=>`<div class="ftag">📄 ${f}<button data-i="${i}">✕</button></div>`).join('');
  el.querySelectorAll('[data-i]').forEach(b=>b.addEventListener('click',()=>{
    const i=parseInt(b.dataset.i);dd.files.splice(i,1);if(dd.fc)dd.fc.splice(i,1);
    swd(S.ws);renderFtags(dd);
  }));
}

// ── AI GENERATORS ────────────────────────────────
async function aiGenDay(ws,d,dd){
  if(!dd.memo.trim()){toast('메모를 입력해주세요');return;}
  const gk=ws+'_'+d;S.genning[gk]=true;renderMain();
  const content=[{type:'text',text:`업무 입력:\n${dd.memo}`}];
  for(const fc of(dd.fc||[])){
    if(fc.type==='img')content.push({type:'image',source:{type:'base64',media_type:fc.mt,data:fc.data}});
    else content.push({type:'text',text:`[파일: ${fc.name}]\n${fc.content}`});
  }
  const res=await callAI([{role:'user',content}],sysDay(S.lv));
  if(res){dd.gen=parseSec(res);S.prevOpen[gk]=true;swd(ws);toast('✅ AI 일지 작성 완료!');}
  S.genning[gk]=false;renderAll();
}
function freeGenDay(ws,d,dd){
  if(!dd.memo.trim()){toast('메모를 입력해주세요');return;}
  dd.gen=freeSummary(dd.memo,S.lv,(dd.files||[]).length);
  S.prevOpen[ws+'_'+d]=true;swd(ws);renderAll();toast('✅ 자동 작성 완료! (무료)');
}
async function regenPS(ws,data){
  const lws=new Date(ws);lws.setDate(lws.getDate()-7);
  const ld=gwd(lws.toISOString().split('T')[0]);
  const logs=DAYS.map((d,i)=>ld.days[d]?.memo?`${DN[d]}: ${ld.days[d].memo}`:null).filter(Boolean);
  const pgk=ws+'_ps';
  if(S.apiKey&&logs.length){
    S.genning[pgk]=true;renderMain();
    const res=await callAI([{role:'user',content:`지난 주 업무:\n${logs.join('\n')}`}],sysWk());
    if(res){data.prevSum={text:'',gen:res};toast('✅ 전주 요약 생성 완료!');}
    S.genning[pgk]=false;
  }else if(logs.length){
    const fs=freeSummary(logs.join('\n'),'medium',0);
    data.prevSum={text:'',gen:`${fs.content}\n\n${fs.results}`};toast('✅ 전주 요약 자동 생성! (무료)');
  }else{
    data.prevSum={text:'지난 주 기록이 없습니다. 직접 입력해주세요.',gen:null};toast('지난 주 기록 없음');
  }
  swd(ws);renderMain();
}
function freeWkGen(ws,data){
  const logs=DAYS.map((d,i)=>data.days[d]?.memo?`${DN[d]}: ${data.days[d].memo}`:null).filter(Boolean);
  if(!logs.length){toast('이번 주 업무 기록이 없습니다');return;}
  const fs=freeSummary(logs.join('\n'),'medium',0);
  if(!data.weekly)data.weekly={};
  data.weekly.gen=`【이번 주 요약】\n${fs.content}\n\n${fs.results}`;
  swd(ws);renderWeekly();toast('✅ 자동 생성 완료!');
}
async function aiWkGen(ws,data){
  const logs=DAYS.map((d,i)=>data.days[d]?.memo?`${DN[d]}:\n${data.days[d].memo}`:null).filter(Boolean);
  if(!logs.length){toast('이번 주 업무 기록이 없습니다');return;}
  const gk=ws+'_wk';S.genning[gk]=true;renderWeekly();
  const res=await callAI([{role:'user',content:`이번 주 업무:\n\n${logs.join('\n\n')}`}],sysWk());
  if(res){if(!data.weekly)data.weekly={};data.weekly.gen=res;toast('✅ AI 주간 요약 완료!');}
  S.genning[gk]=false;swd(ws);renderWeekly();
}
async function aiCompare(ws,data){
  const lws=new Date(ws);lws.setDate(lws.getDate()-7);
  const ld=gwd(lws.toISOString().split('T')[0]);
  const cur=DAYS.map((d,i)=>data.days[d]?.memo?`${DN[d]}: ${data.days[d].memo}`:null).filter(Boolean);
  const prev=DAYS.map((d,i)=>ld.days[d]?.memo?`${DN[d]}: ${ld.days[d].memo}`:null).filter(Boolean);
  if(!cur.length){toast('이번 주 기록이 없습니다');return;}
  const ck=ws+'_cmp';S.genning[ck]=true;renderWeekly();
  const res=await callAI([{role:'user',content:`전주:\n${prev.join('\n')||'기록 없음'}\n\n이번주:\n${cur.join('\n')}`}],sysCmp());
  if(res){if(!data.weekly)data.weekly={};data.weekly.compare=res;toast('✅ 진척 분석 완료!');}
  S.genning[ck]=false;swd(ws);renderWeekly();
}

// ── EXPORT ───────────────────────────────────────
function cEM(){document.getElementById('expmod').style.display='none';}
function genRH(ws){
  const data=gwd(ws),nm=S.name||'이름 미설정',dp=S.dept||'소속 미설정';
  let b=`<h1>주간 업무 보고서</h1><p>${nm} | ${dp} | ${wkLabel(ws)}</p><hr>`;
  DAYS.forEach((d,i)=>{
    const dd=data.days[d];if(!dd?.memo&&!dd?.gen)return;
    b+=`<h2>${DN[d]} (${fmtDate(ws,i)})</h2>`;
    if(dd.memo)b+=`<p><b>입력:</b> ${dd.memo.replace(/\n/g,'<br>')}</p>`;
    if(dd.gen){
      if(dd.gen.content)b+=`<p><b>업무내용:</b> ${dd.gen.content.replace(/\n/g,'<br>')}</p>`;
      if(dd.gen.results)b+=`<p><b>추진결과:</b> ${dd.gen.results.replace(/\n/g,'<br>')}</p>`;
      if(dd.gen.insights)b+=`<p><b>인사이트:</b> ${dd.gen.insights.replace(/\n/g,'<br>')}</p>`;
    }
  });
  if(data.weekly?.gen)b+=`<hr><h2>주간 요약</h2><p>${data.weekly.gen.replace(/\n/g,'<br>')}</p>`;
  return b;
}
function exportPDF(){
  const w=window.open('','_blank');
  w.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><style>body{font-family:'Malgun Gothic',sans-serif;padding:28px;font-size:13px;line-height:1.75}h1{font-size:17px}h2{font-size:14px;margin:14px 0 6px}p{margin-bottom:8px}hr{border:none;border-top:1px solid #ddd;margin:14px 0}@media print{body{padding:10px}}</style></head><body>${genRH(S.ws)}</body></html>`);
  w.document.close();setTimeout(()=>w.print(),400);cEM();
}
function exportExcel(){
  if(!window.XLSX){toast('XLSX 로드 중...');return;}
  const ws=S.ws,data=gwd(ws);
  const wb=XLSX.utils.book_new();
  const rows=[['날짜','요일','업무 입력','업무내용','추진결과','업무 인사이트']];
  DAYS.forEach((d,i)=>{
    const dd=data.days[d];
    rows.push([fmtDate(ws,i),DN[d],dd?.memo||'',dd?.gen?.content||'',dd?.gen?.results||'',dd?.gen?.insights||'']);
  });
  const sh=XLSX.utils.aoa_to_sheet(rows);
  sh['!cols']=[{wch:16},{wch:8},{wch:32},{wch:36},{wch:36},{wch:36}];
  XLSX.utils.book_append_sheet(wb,sh,'주간 업무');
  if(data.weekly?.gen){const sh2=XLSX.utils.aoa_to_sheet([['주간 요약'],[data.weekly.gen]]);XLSX.utils.book_append_sheet(wb,sh2,'요약');}
  XLSX.writeFile(wb,`업무일지_${ws}.xlsx`);cEM();toast('✅ Excel 다운로드 완료!');
}
function exportWord(){
  const html=`<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word'><head><meta charset='UTF-8'><style>body{font-family:'맑은 고딕',sans-serif;font-size:11pt;line-height:1.8}h1{font-size:16pt}h2{font-size:13pt;margin-top:14pt}p{margin-bottom:7pt}hr{border:none;border-top:1pt solid #ccc}</style></head><body>${genRH(S.ws)}</body></html>`;
  const blob=new Blob([html],{type:'application/msword'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`업무일지_${S.ws}.doc`;a.click();
  cEM();toast('✅ Word 다운로드 완료!');
}

['setmod','expmod'].forEach(id=>{
  document.getElementById(id).addEventListener('click',e=>{if(e.target.id===id)document.getElementById(id).style.display='none';});
});

renderAll();
</script>
